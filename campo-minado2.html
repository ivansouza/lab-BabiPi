<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Minado 2 · solver exato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #f3f4f6;
            touch-action: manipulation; /* Previne zoom duplo no mobile */
        }

        .digital-font {
            font-family: 'Share Tech Mono', monospace;
        }

        .game-board {
            background-color: #bdbdbd;
            border-top: 4px solid #fff;
            border-left: 4px solid #fff;
            border-bottom: 4px solid #7b7b7b;
            border-right: 4px solid #7b7b7b;
            padding: 8px;
        }

        .game-header {
            border-top: 3px solid #7b7b7b;
            border-left: 3px solid #7b7b7b;
            border-bottom: 3px solid #fff;
            border-right: 3px solid #fff;
            background-color: #bdbdbd;
        }

        .grid-container {
            border-top: 3px solid #7b7b7b;
            border-left: 3px solid #7b7b7b;
            border-bottom: 3px solid #fff;
            border-right: 3px solid #fff;
        }

        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.125rem;
            cursor: pointer;
            user-select: none;
            background-color: #bdbdbd;
        }

        .cell-hidden {
            border-top: 3px solid #fff;
            border-left: 3px solid #fff;
            border-bottom: 3px solid #7b7b7b;
            border-right: 3px solid #7b7b7b;
        }

        .cell-hidden:active {
            border: 1px solid #7b7b7b;
            background-color: #e5e7eb;
        }

        .cell-revealed {
            border: 1px solid #7b7b7b;
            background-color: #e5e7eb;
        }

        .cell-heat {
            font-size: 0.62rem;
            font-weight: 700;
            color: #111827;
        }

        .cell-mine {
            background-color: #ef4444; /* Vermelho quando explode */
        }

        /* Cores dos números clássicos */
        .color-1 { color: #2563eb; } /* Azul */
        .color-2 { color: #16a34a; } /* Verde */
        .color-3 { color: #dc2626; } /* Vermelho */
        .color-4 { color: #1e3a8a; } /* Azul escuro */
        .color-5 { color: #7f1d1d; } /* Marrom/Vermelho escuro */
        .color-6 { color: #0ea5e9; } /* Ciano */
        .color-7 { color: #000000; } /* Preto */
        .color-8 { color: #4b5563; } /* Cinza */

        .btn-face {
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #bdbdbd;
            border-top: 3px solid #fff;
            border-left: 3px solid #fff;
            border-bottom: 3px solid #7b7b7b;
            border-right: 3px solid #7b7b7b;
            cursor: pointer;
        }
        .btn-face:active {
            border-top: 3px solid #7b7b7b;
            border-left: 3px solid #7b7b7b;
            border-bottom: 3px solid #fff;
            border-right: 3px solid #fff;
        }

    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full flex flex-col items-center">
        <h1 class="text-3xl font-bold mb-1 text-gray-800 drop-shadow-sm">Campo Minado 2</h1>
        <p class="text-sm text-gray-500 mb-4">Autoplay com solver de probabilidade exato (sem modelo)</p>
        
        <!-- Seleção de Dificuldade e Modo (Mobile) -->
        <div class="w-full flex justify-between items-center mb-4 gap-2">
            <select id="difficulty" class="bg-white border border-gray-300 text-gray-700 py-1 px-3 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="easy">Fácil (9x9, 10 minas)</option>
                <option value="medium">Médio (12x12, 25 minas)</option>
                <option value="hard">Difícil (16x16, 40 minas)</option>
            </select>
            
            <button id="mode-toggle" class="bg-blue-100 border border-blue-400 text-blue-800 py-1 px-3 rounded shadow-sm font-semibold flex items-center gap-1 transition-colors">
                <span>⛏️ Cavar</span>
            </button>
        </div>

        <!-- Novos botões de Autoplay e Configurações -->
        <div class="w-full flex justify-between items-center mb-4 gap-2">
            <select id="speed-select" title="Velocidade do autoplay" class="bg-gray-200 border border-gray-400 text-gray-800 py-1 px-2 rounded shadow-sm font-semibold">
                <option value="0">⚡ Turbo</option>
                <option value="80">🐇 Rápido</option>
                <option value="300" selected>🚶 Normal</option>
                <option value="800">🐢 Lento</option>
            </select>
            <button id="heat-toggle-btn" title="Mostrar % de mina em cada célula oculta" class="bg-gray-200 border border-gray-400 text-gray-800 py-1 px-3 rounded shadow-sm font-semibold flex items-center gap-1 transition-colors hover:bg-gray-300">
                <span id="heat-toggle-text">🌡️ %</span>
            </button>
            <button id="debug-toggle-btn" class="bg-gray-200 border border-gray-400 text-gray-800 py-1 px-3 rounded shadow-sm font-semibold flex items-center gap-1 transition-colors hover:bg-gray-300">
                <span>🐞 Log</span>
            </button>
            <button id="autoplay-btn" class="bg-purple-100 border border-purple-400 text-purple-800 py-1 px-3 rounded shadow-sm font-semibold flex items-center justify-center gap-1 transition-colors hover:bg-purple-200 flex-1">
                <span id="autoplay-text">🤖 Autoplay (Off)</span>
            </button>
        </div>

        <!-- Status do solver -->
        <div id="solver-status" class="w-full max-w-md mb-4 rounded border px-3 py-2 text-sm bg-gray-100 border-gray-300 text-gray-800 font-semibold">
            Pronto. Ligue o autoplay ou jogue você mesmo.
        </div>

        <!-- Placa do Jogo -->
        <div class="game-board rounded-sm shadow-2xl inline-block">
            <!-- Cabeçalho (Contador, Rosto, Tempo) -->
            <div class="game-header p-2 mb-3 flex justify-between items-center h-16">
                <!-- Contador de Minas -->
                <div class="bg-black text-red-500 digital-font text-3xl px-2 py-1 rounded border-2 border-gray-600 border-t-gray-800 border-l-gray-800 tracking-wider w-20 text-center" id="mine-count">
                    010
                </div>

                <!-- Botão de Reiniciar (Rosto) -->
                <button id="reset-btn" class="btn-face">
                    😃
                </button>

                <!-- Cronômetro -->
                <div class="bg-black text-red-500 digital-font text-3xl px-2 py-1 rounded border-2 border-gray-600 border-t-gray-800 border-l-gray-800 tracking-wider w-20 text-center" id="timer">
                    000
                </div>
            </div>

            <!-- Grade -->
            <div class="grid-container bg-gray-300" id="grid">
                <!-- Células geradas via JS -->
            </div>
        </div>
        
        <p class="mt-6 text-sm text-gray-500 text-center">
            <strong>Dica:</strong> No computador, use o botão direito para colocar bandeiras. No celular, use o botão "Cavar/Bandeira" acima do tabuleiro.
        </p>

        <!-- Painel de Depuração -->
        <div id="debug-panel" class="hidden w-full max-w-md mt-4 bg-black text-green-400 font-mono text-xs rounded shadow-inner h-48 flex flex-col border border-gray-600">
            <div class="flex justify-between items-center bg-gray-800 px-2 py-1 border-b border-gray-600">
                <span class="text-gray-300 font-semibold tracking-wider">Terminal Log</span>
                <button id="copy-log-btn" class="text-gray-300 hover:text-white bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded transition-colors flex items-center gap-1 shadow">
                    📋 Copiar
                </button>
            </div>
            <div id="debug-log" class="p-2 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div id="game-over-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm w-full mx-4 transform transition-all scale-95 opacity-0" id="modal-content">
            <h2 id="modal-title" class="text-2xl font-bold mb-2">Fim de Jogo</h2>
            <p id="modal-message" class="text-gray-600 mb-6">Você perdeu!</p>
            <button onclick="initGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full w-full transition-colors shadow-md">
                Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        // Configurações e Estado do Jogo
        const config = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 12, cols: 12, mines: 25 },
            hard: { rows: 16, cols: 16, mines: 40 }
        };

        let rows, cols, totalMines;
        let board = [];
        let minesLeft = 0;
        let cellsRevealed = 0;
        let isGameOver = false;
        let isFirstClick = true;
        let timerInterval = null;
        let secondsElapsed = 0;
        let flagMode = false; // Para mobile (Cavar vs Bandeira)
        
        let isAutoplayRunning = false;
        let autoplayTimeout = null;

        // Elementos do DOM
        const gridElement = document.getElementById('grid');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const difficultySelect = document.getElementById('difficulty');
        const modeToggleBtn = document.getElementById('mode-toggle');
        
        const modal = document.getElementById('game-over-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        // Novos Elementos
        const debugToggleBtn = document.getElementById('debug-toggle-btn');
        const debugPanel = document.getElementById('debug-panel');
        const debugLog = document.getElementById('debug-log');
        const copyLogBtn = document.getElementById('copy-log-btn');
        const autoplayBtn = document.getElementById('autoplay-btn');
        const autoplayText = document.getElementById('autoplay-text');

        // Inicialização
        function initGame() {
            // Parar timer e esconder modal
            stopTimer();
            hideModal();
            stopAutoplay();

            // Obter dificuldade
            const diff = difficultySelect.value;
            rows = config[diff].rows;
            cols = config[diff].cols;
            totalMines = config[diff].mines;

            // Resetar variáveis
            board = [];
            minesLeft = totalMines;
            cellsRevealed = 0;
            isGameOver = false;
            isFirstClick = true;
            secondsElapsed = 0;
            
            updateDisplay();
            resetBtn.textContent = '😃';

            // Configurar Grid CSS
            gridElement.style.display = 'grid';
            gridElement.style.gridTemplateColumns = `repeat(${cols}, max-content)`;
            gridElement.innerHTML = ''; // Limpar grade antiga

            // Criar estrutura de dados e elementos DOM
            for (let r = 0; r < rows; r++) {
                let rowArray = [];
                for (let c = 0; c < cols; c++) {
                    // Estrutura de dados
                    let cellData = {
                        r: r,
                        c: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    };
                    rowArray.push(cellData);

                    // Elemento DOM
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell', 'cell-hidden');
                    cellEl.dataset.r = r;
                    cellEl.dataset.c = c;

                    // Eventos
                    cellEl.addEventListener('click', (e) => handleLeftClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); // Previne menu padrão
                        handleRightClick(r, c);
                    });

                    // Efeito de susto no rosto ao clicar (opcional)
                    cellEl.addEventListener('mousedown', (e) => {
                        if (!isGameOver && e.button === 0 && !cellData.isRevealed) resetBtn.textContent = '😮';
                    });
                    cellEl.addEventListener('mouseup', () => {
                        if (!isGameOver) resetBtn.textContent = '😃';
                    });
                    cellEl.addEventListener('mouseleave', () => {
                        if (!isGameOver) resetBtn.textContent = '😃';
                    });

                    gridElement.appendChild(cellEl);
                }
                board.push(rowArray);
            }
        }

        // Posicionar minas após o primeiro clique (garante que o primeiro clique nunca é mina)
        function placeMines(firstR, firstC) {
            let minesPlaced = 0;
            while (minesPlaced < totalMines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                
                // Não colocar na posição do primeiro clique nem se já for mina
                // Para ser mais amigável, também podemos evitar os adjacentes do primeiro clique, 
                // mas para manter simples, evitamos apenas o próprio quadrado clicado.
                if (!board[r][c].isMine && (r !== firstR || c !== firstC)) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            calculateNeighbors();
        }

        // Calcular números vizinhos
        function calculateNeighbors() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].isMine) {
                        let count = 0;
                        // Checar 8 direções
                        for (let i = -1; i <= 1; i++) {
                            for (let j = -1; j <= 1; j++) {
                                let nr = r + i;
                                let nc = c + j;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        // Interação: Clique Esquerdo (Revelar)
        function handleLeftClick(r, c) {
            if (isGameOver) return;
            let cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            // Se modo bandeira mobile estiver ativo, agir como clique direito
            if (flagMode) {
                handleRightClick(r, c);
                return;
            }

            if (isFirstClick) {
                isFirstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cell.isMine) {
                gameOver(false, r, c);
            } else {
                revealCell(r, c);
                checkWinCondition();
            }
        }

        // Interação: Clique Direito / Modo Bandeira (Sinalizar)
        function handleRightClick(r, c) {
            if (isGameOver) return;
            let cell = board[r][c];
            if (cell.isRevealed) return;

            // Se é o primeiro clique e o usuário já está botando bandeira, iniciar timer
            if (isFirstClick) {
                isFirstClick = false;
                // Coloca minas em local seguro genérico (já que ele não revelou nada)
                placeMines(-1, -1); 
                startTimer();
            }

            cell.isFlagged = !cell.isFlagged;
            minesLeft += cell.isFlagged ? -1 : 1;
            
            updateDisplay();
            updateCellDOM(r, c);
        }

        // Lógica de Revelação (Flood Fill para áreas vazias)
        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cellsRevealed++;
            updateCellDOM(r, c);

            // Se não tem minas vizinhas, revelar adjacentes recursivamente
            if (cell.neighborMines === 0) {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        let nr = r + i;
                        let nc = c + j;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        // Atualizar o visual de uma célula específica
        function updateCellDOM(r, c) {
            let cell = board[r][c];
            // Encontrar o elemento no DOM (calculando o index)
            let index = r * cols + c;
            let el = gridElement.children[index];

            if (cell.isRevealed) {
                el.classList.remove('cell-hidden');
                el.classList.add('cell-revealed');
                
                if (cell.isMine) {
                    el.classList.add('cell-mine');
                    el.textContent = '💣';
                } else if (cell.neighborMines > 0) {
                    el.textContent = cell.neighborMines;
                    el.classList.add(`color-${cell.neighborMines}`);
                } else {
                    el.textContent = '';
                }
            } else {
                el.classList.remove('cell-revealed', 'cell-mine');
                el.classList.add('cell-hidden');
                // Limpar cores antigas
                for(let i=1; i<=8; i++) el.classList.remove(`color-${i}`);
                
                if (cell.isFlagged) {
                    el.textContent = '🚩';
                } else {
                    el.textContent = '';
                }
            }
        }

        // Fim de Jogo (Vitória ou Derrota)
        function gameOver(isWin, explodedR = -1, explodedC = -1) {
            isGameOver = true;
            stopTimer();
            stopAutoplay();

            if (isWin) {
                resetBtn.textContent = '😎';
                // Marcar as minas restantes com bandeiras
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.isFlagged = true;
                            updateCellDOM(r, c);
                        }
                    }
                }
                minesLeft = 0;
                updateDisplay();
                showModal("Vitória!", "Parabéns, você limpou o campo minado!", "text-green-600");
            } else {
                resetBtn.textContent = '😵';
                // Revelar todas as minas
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let cell = board[r][c];
                        if (cell.isMine) {
                            // Se era mina e não estava com bandeira, revelar
                            cell.isRevealed = true;
                            updateCellDOM(r, c);
                            // Destacar a mina que explodiu
                            if (r === explodedR && c === explodedC) {
                                let el = gridElement.children[r * cols + c];
                                el.classList.add('bg-red-500'); 
                            }
                        } else if (!cell.isMine && cell.isFlagged) {
                            // Bandeira errada
                            let el = gridElement.children[r * cols + c];
                            el.innerHTML = '<span class="relative">💣<span class="absolute inset-0 flex items-center justify-center text-red-500 text-2xl font-bold">❌</span></span>';
                        }
                    }
                }
                showModal("Fim de Jogo", "Você pisou em uma mina!", "text-red-600");
            }
        }

        function checkWinCondition() {
            if (cellsRevealed === (rows * cols) - totalMines) {
                gameOver(true);
            }
        }

        // Utilidades de Display e Tempo
        function updateDisplay() {
            // Formatar contador de minas para 3 dígitos
            let mCount = minesLeft < 0 ? '-' + Math.abs(minesLeft).toString().padStart(2, '0') : minesLeft.toString().padStart(3, '0');
            mineCountElement.textContent = mCount;
            
            // Formatar timer para 3 dígitos
            timerElement.textContent = Math.min(secondsElapsed, 999).toString().padStart(3, '0');
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateDisplay();
                if (secondsElapsed >= 999) stopTimer(); // Cap em 999
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Alternância de Modo (Mobile)
        modeToggleBtn.addEventListener('click', () => {
            flagMode = !flagMode;
            if (flagMode) {
                modeToggleBtn.innerHTML = '<span>🚩 Bandeira</span>';
                modeToggleBtn.classList.replace('bg-blue-100', 'bg-red-100');
                modeToggleBtn.classList.replace('border-blue-400', 'border-red-400');
                modeToggleBtn.classList.replace('text-blue-800', 'text-red-800');
            } else {
                modeToggleBtn.innerHTML = '<span>⛏️ Cavar</span>';
                modeToggleBtn.classList.replace('bg-red-100', 'bg-blue-100');
                modeToggleBtn.classList.replace('border-red-400', 'border-blue-400');
                modeToggleBtn.classList.replace('text-red-800', 'text-blue-800');
            }
        });

        // Eventos Globais
        resetBtn.addEventListener('click', initGame);
        difficultySelect.addEventListener('change', initGame);

        // Funções do Modal
        function showModal(title, msg, titleColorClass) {
            setTimeout(() => {
                modalTitle.textContent = title;
                modalTitle.className = `text-3xl font-bold mb-2 ${titleColorClass}`;
                modalMessage.textContent = msg;
                modal.classList.remove('hidden');
                // Pequeno delay para animação css
                requestAnimationFrame(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                });
            }, 500); // Meio segundo de atraso para o jogador ver a explosão
        }

        function hideModal() {
            modal.classList.add('hidden');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
        }

        // --- AUTOPLAY COM SOLVER DE PROBABILIDADE ---

        // Funções de Depuração (Log)
        debugToggleBtn.addEventListener('click', () => {
            debugPanel.classList.toggle('hidden');
        });

        copyLogBtn.addEventListener('click', () => {
            const textToCopy = debugLog.innerText;
            if (!textToCopy) return;
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            tempTextArea.style.position = "fixed";
            tempTextArea.style.left = "-9999px";
            tempTextArea.style.top = "0";
            document.body.appendChild(tempTextArea);
            tempTextArea.focus();
            tempTextArea.select();
            try {
                document.execCommand('copy');
                const originalHTML = copyLogBtn.innerHTML;
                copyLogBtn.innerHTML = '✅ Copiado!';
                copyLogBtn.classList.replace('text-gray-300', 'text-green-400');
                setTimeout(() => {
                    copyLogBtn.innerHTML = originalHTML;
                    copyLogBtn.classList.replace('text-green-400', 'text-gray-300');
                }, 2000);
            } catch (err) {
                console.error('Erro ao copiar log:', err);
                copyLogBtn.innerHTML = '❌ Erro';
            }
            document.body.removeChild(tempTextArea);
        });

        function logDebug(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const msgDiv = document.createElement('div');
            msgDiv.textContent = `[${time}] ${message}`;
            msgDiv.className = isError ? 'text-red-400 font-bold mb-1' : 'mb-1 text-green-400';
            debugLog.appendChild(msgDiv);
            debugLog.scrollTop = debugLog.scrollHeight;
        }


        // Controle de Estado do Autoplay
        function stopAutoplay() {
            isAutoplayRunning = false;
            if (autoplayTimeout) clearTimeout(autoplayTimeout);
            autoplayBtn.classList.replace('bg-red-100', 'bg-purple-100');
            autoplayBtn.classList.replace('border-red-400', 'border-purple-400');
            autoplayBtn.classList.replace('text-red-800', 'text-purple-800');
            autoplayText.textContent = '🤖 Autoplay (Off)';
        }

        autoplayBtn.addEventListener('click', () => {
            if (isGameOver) return;
            isAutoplayRunning = !isAutoplayRunning;
            if (isAutoplayRunning) {
                autoplayBtn.classList.replace('bg-purple-100', 'bg-red-100');
                autoplayBtn.classList.replace('border-purple-400', 'border-red-400');
                autoplayBtn.classList.replace('text-purple-800', 'text-red-800');
                autoplayText.textContent = '⏹️ Parar Autoplay';
                runAutoplayLoop();
            } else {
                stopAutoplay();
            }
        });

        async function runAutoplayLoop() {
            if (!isAutoplayRunning || isGameOver) { stopAutoplay(); return; }
            try {
                autoplayText.textContent = '🤖 Pensando...';
                playAIMove();
                if (isAutoplayRunning && !isGameOver) {
                    autoplayText.textContent = '⏹️ Parar Autoplay';
                    // Pequena pausa entre jogadas para dar para acompanhar
                    autoplayTimeout = setTimeout(runAutoplayLoop, Number(speedSelect.value));
                } else {
                    stopAutoplay();
                }
            } catch (error) {
                console.error('Erro no solver:', error);
                logDebug(`Erro no solver: ${error.message}`, true);
                debugPanel.classList.remove('hidden');
                stopAutoplay();
                autoplayText.textContent = 'Erro no solver';
                setTimeout(() => { if (!isGameOver && !isAutoplayRunning) autoplayText.textContent = '🤖 Autoplay (Off)'; }, 4000);
            }
        }

        // --- Solver de probabilidade exato ---
        // Entrada: view[r][c] = -1 oculta, -2 bandeira, 0..8 número revelado; totalMinas.
        // Saída: { prob: Float64Array (rows*cols, NaN p/ não-ocultas), safe: [], mines: [], aprox, metodo }
        const SOLVER_LIMITE_CELULAS = 48;     // células por componente para enumeração exata
        const SOLVER_LIMITE_NOS = 3000000;    // nós de busca por componente
        const lnFat = [0];
        function lnC(n, k) {
            if (k < 0 || k > n) return -Infinity;
            while (lnFat.length <= n) lnFat.push(lnFat[lnFat.length - 1] + Math.log(lnFat.length));
            return lnFat[n] - lnFat[k] - lnFat[n - k];
        }
        function resolverCampo(view, R, C, totalMinas) {
            const N = R * C, idx = (r, c) => r * C + c;
            const viz = (i) => { const r = (i / C) | 0, c = i % C, o = [];
                for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { if (!a && !b) continue;
                    const nr = r + a, nc = c + b; if (nr >= 0 && nr < R && nc >= 0 && nc < C) o.push(idx(nr, nc)); }
                return o; };
            const st = new Int8Array(N); let bandeiras = 0;
            for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { st[idx(r, c)] = view[r][c]; if (view[r][c] === -2) bandeiras++; }
            // estado conhecido: 0 desconhecido, 1 seguro, 2 mina
            const known = new Int8Array(N);
            for (let i = 0; i < N; i++) if (st[i] === -2) known[i] = 2;
            // restrições: {cells:[ocultas desconhecidas], need}
            const montar = () => {
                const cons = [];
                for (let i = 0; i < N; i++) {
                    if (st[i] < 0) continue;
                    let need = st[i]; const cells = [];
                    for (const j of viz(i)) { if (st[j] >= 0) continue;
                        if (known[j] === 2) need--; else if (known[j] === 0) cells.push(j); }
                    if (cells.length) cons.push({ cells, need });
                }
                return cons;
            };
            const safe = new Set(), mines = new Set();
            const marcar = (j, v) => { if (known[j]) return false; known[j] = v; (v === 1 ? safe : mines).add(j); return true; };
            // 1) regras básicas + regra do subconjunto, até estabilizar
            for (let it = 0; it < 50; it++) {
                let mudou = false;
                const cons = montar();
                for (const k of cons) {
                    if (k.need === 0) for (const j of k.cells) mudou = marcar(j, 1) || mudou;
                    else if (k.need === k.cells.length) for (const j of k.cells) mudou = marcar(j, 2) || mudou;
                }
                if (!mudou) {
                    const sets = cons.map((k) => new Set(k.cells));
                    for (let a = 0; a < cons.length && !mudou; a++) for (let b = 0; b < cons.length; b++) {
                        if (a === b || cons[a].cells.length >= cons[b].cells.length) continue;
                        if (!cons[a].cells.every((x) => sets[b].has(x))) continue;
                        const resto = cons[b].cells.filter((x) => !sets[a].has(x)), d = cons[b].need - cons[a].need;
                        if (d === 0) for (const j of resto) mudou = marcar(j, 1) || mudou;
                        else if (d === resto.length) for (const j of resto) mudou = marcar(j, 2) || mudou;
                    }
                }
                if (!mudou) break;
            }
            // 2) enumeração exata por componentes
            const cons = montar();
            const minasRest = totalMinas - bandeiras - [...mines].length;
            const fronteira = new Set(); cons.forEach((k) => k.cells.forEach((j) => fronteira.add(j)));
            const interior = [];
            for (let i = 0; i < N; i++) if (st[i] === -1 && !known[i] && !fronteira.has(i)) interior.push(i);
            // componentes (union-find)
            const pai = new Map(); const find = (x) => { while (pai.get(x) !== x) { pai.set(x, pai.get(pai.get(x))); x = pai.get(x); } return x; };
            fronteira.forEach((j) => pai.set(j, j));
            cons.forEach((k) => { for (let t = 1; t < k.cells.length; t++) { const a = find(k.cells[0]), b = find(k.cells[t]); if (a !== b) pai.set(a, b); } });
            const grupos = new Map();
            fronteira.forEach((j) => { const r = find(j); if (!grupos.has(r)) grupos.set(r, []); grupos.get(r).push(j); });
            let aprox = false;
            const comps = [];
            for (const cells of grupos.values()) {
                const pos = new Map(cells.map((j, t) => [j, t]));
                const ks = cons.filter((k) => pos.has(k.cells[0])).map((k) => ({ v: k.cells.map((j) => pos.get(j)), need: k.need }));
                const n = cells.length;
                // ordena células por adjacência (BFS) para podar cedo
                const porCel = Array.from({ length: n }, () => []);
                ks.forEach((k, q) => k.v.forEach((t) => porCel[t].push(q)));
                const ordem = [], visto = new Uint8Array(n); const fila = [0]; visto[0] = 1;
                while (fila.length) { const t = fila.shift(); ordem.push(t); for (const q of porCel[t]) for (const u of ks[q].v) if (!visto[u]) { visto[u] = 1; fila.push(u); } }
                for (let t = 0; t < n; t++) if (!visto[t]) ordem.push(t);
                const comp = { cells, n, cnt: null, cellCnt: null, aprox: false };
                if (n <= SOLVER_LIMITE_CELULAS) {
                    const atrib = new Int8Array(n).fill(-1), soma = new Int32Array(ks.length), livres = new Int32Array(ks.length);
                    ks.forEach((k, q) => { livres[q] = k.v.length; });
                    const cnt = new Float64Array(n + 1), cellCnt = Array.from({ length: n + 1 }, () => new Float64Array(n));
                    let nos = 0, estourou = false;
                    const rec = (p, m) => {
                        if (++nos > SOLVER_LIMITE_NOS) { estourou = true; return; }
                        if (p === n) { cnt[m]++; const cc = cellCnt[m]; for (let t = 0; t < n; t++) if (atrib[t]) cc[t]++; return; }
                        const t = ordem[p];
                        for (let v = 0; v <= 1 && !estourou; v++) {
                            if (m + v > minasRest) break;
                            let ok = true;
                            for (const q of porCel[t]) { const s = soma[q] + v, l = livres[q] - 1; if (s > ks[q].need || s + l < ks[q].need) { ok = false; break; } }
                            if (!ok) continue;
                            atrib[t] = v; for (const q of porCel[t]) { soma[q] += v; livres[q]--; }
                            rec(p + 1, m + v);
                            for (const q of porCel[t]) { soma[q] -= v; livres[q]++; } atrib[t] = -1;
                        }
                    };
                    rec(0, 0);
                    if (!estourou) { comp.cnt = cnt; comp.cellCnt = cellCnt; }
                }
                if (!comp.cnt) { comp.aprox = true; aprox = true; }
                comps.push(comp);
            }
            // 3) combina componentes com a contagem global (interior por combinatória)
            const U = interior.length;
            const prob = new Float64Array(N).fill(NaN);
            const exatos = comps.filter((c) => !c.aprox);
            // para componentes aproximados: densidade local média
            let minasAprox = 0, celsAprox = 0;
            for (const comp of comps) if (comp.aprox) {
                for (const j of comp.cells) {
                    let pior = 0;
                    for (const k of cons) if (k.cells.includes(j)) pior = Math.max(pior, k.need / k.cells.length);
                    prob[j] = pior; minasAprox += pior; celsAprox++;
                }
            }
            const Mx = Math.max(0, Math.round(minasRest - minasAprox));
            // distribuições em log-escala: dist[m] = ln(nº de configurações com m minas)
            const toLog = (cnt) => Array.from(cnt, (x) => (x > 0 ? Math.log(x) : -Infinity));
            const lse = (a, b) => (a === -Infinity ? b : b === -Infinity ? a : Math.max(a, b) + Math.log1p(Math.exp(-Math.abs(a - b))));
            const conv = (A, B) => { const o = new Array(A.length + B.length - 1).fill(-Infinity);
                for (let i = 0; i < A.length; i++) if (A[i] > -Infinity) for (let j = 0; j < B.length; j++) if (B[j] > -Infinity) o[i + j] = lse(o[i + j], A[i] + B[j]); return o; };
            const logs = exatos.map((c) => toLog(c.cnt));
            const pre = [[0]]; for (let i = 0; i < logs.length; i++) pre.push(conv(pre[i], logs[i]));
            const suf = [[0]]; for (let i = logs.length - 1; i >= 0; i--) suf.unshift(conv(logs[i], suf[0]));
            const total = pre[logs.length];
            const pesoInt = (m) => lnC(U, Mx - m); // configurações do interior com Mx-m minas
            let lnZ = -Infinity, lnIntMinas = -Infinity;
            for (let m = 0; m < total.length; m++) {
                if (total[m] === -Infinity || Mx - m < 0 || Mx - m > U) continue;
                const w = total[m] + pesoInt(m); lnZ = lse(lnZ, w);
                if (U > 0 && Mx - m > 0) lnIntMinas = lse(lnIntMinas, w + Math.log((Mx - m) / U));
            }
            if (lnZ === -Infinity) { // inconsistente (ex.: bandeira errada): cai para aproximação
                aprox = true;
                for (const comp of exatos) for (let t = 0; t < comp.n; t++) {
                    let s = 0, z = 0; for (let m = 0; m <= comp.n; m++) { s += comp.cellCnt[m][t]; z += comp.cnt[m]; }
                    prob[comp.cells[t]] = z ? s / z : 0.5;
                }
                const dens = U ? Math.min(1, Math.max(0, (minasRest - minasAprox) / (U + celsAprox))) : 0;
                for (const j of interior) prob[j] = dens;
            } else {
                for (const j of interior) prob[j] = Math.exp(lnIntMinas - lnZ);
                exatos.forEach((comp, i) => {
                    const outros = conv(pre[i], suf[i + 1]);
                    for (let t = 0; t < comp.n; t++) {
                        let acc = -Infinity;
                        for (let k = 0; k <= comp.n; k++) {
                            const cc = comp.cellCnt[k][t]; if (!cc) continue;
                            for (let o = 0; o < outros.length; o++) {
                                if (outros[o] === -Infinity) continue; const m = k + o;
                                if (Mx - m < 0 || Mx - m > U) continue;
                                acc = lse(acc, Math.log(cc) + outros[o] + pesoInt(m));
                            }
                        }
                        prob[comp.cells[t]] = acc === -Infinity ? 0 : Math.exp(acc - lnZ);
                    }
                });
            }
            for (const j of safe) prob[j] = 0;
            for (const j of mines) prob[j] = 1;
            const EPS = 1e-12;
            for (let i = 0; i < N; i++) if (st[i] === -1 && !known[i] && !Number.isNaN(prob[i])) {
                const certo = !comps.some((c) => c.aprox && c.cells.includes(i));
                if (certo && prob[i] < EPS) safe.add(i); else if (certo && prob[i] > 1 - EPS) mines.add(i);
            }
            return { prob, safe: [...safe], mines: [...mines], aprox, comps: comps.length, fronteira: fronteira.size, interior: U };
        }

        // Escolhe a jogada: seguras primeiro, depois minas certas (bandeira), senão o menor risco
        function escolherJogada(view, R, C, totalMinas) {
            const t0 = performance.now();
            const res = resolverCampo(view, R, C, totalMinas);
            const ms = performance.now() - t0;
            const at = (i) => [(i / C) | 0, i % C];
            if (res.safe.length) {
                // entre as seguras, prefere a que tem mais vizinhas ocultas (abre mais)
                let best = res.safe[0], bs = -1;
                for (const i of res.safe) { const [r, c] = at(i); let h = 0;
                    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const nr = r + a, nc = c + b;
                        if ((a || b) && nr >= 0 && nr < R && nc >= 0 && nc < C && view[nr][nc] === -1) h++; }
                    if (h > bs) { bs = h; best = i; } }
                return { acao: 'cavar', rc: at(best), risco: 0, certa: true, ms, res };
            }
            if (res.mines.length) return { acao: 'bandeira', rc: at(res.mines[0]), risco: 1, certa: true, ms, res };
            let best = -1, bp = Infinity, bt = -Infinity;
            for (let i = 0; i < R * C; i++) {
                if (view[at(i)[0]][at(i)[1]] !== -1 || Number.isNaN(res.prob[i])) continue;
                const p = res.prob[i], [r, c] = at(i);
                // desempate: mais vizinhas ocultas desconhecidas (informação) e cantos/bordas
                let h = 0, num = 0;
                for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const nr = r + a, nc = c + b;
                    if ((a || b) && nr >= 0 && nr < R && nc >= 0 && nc < C) { if (view[nr][nc] === -1) h++; else if (view[nr][nc] >= 0) num++; } }
                const borda = (r === 0 || r === R - 1 ? 1 : 0) + (c === 0 || c === C - 1 ? 1 : 0);
                // célula sem vizinhos revelados: canto tem mais chance de ser 0 (abre área)
                const t = num === 0 ? borda * 10 - h : h;
                if (p < bp - 1e-9 || (Math.abs(p - bp) <= 1e-9 && t > bt)) { bp = p; bt = t; best = i; }
            }
            if (best < 0) return null;
            return { acao: 'cavar', rc: at(best), risco: bp, certa: false, ms, res };
        }

        // --- Integração com o jogo ---
        const speedSelect = document.getElementById('speed-select');
        const heatBtn = document.getElementById('heat-toggle-btn');
        const statusEl = document.getElementById('solver-status');
        speedSelect.value = localStorage.getItem('cm2Velocidade') || '300';
        speedSelect.addEventListener('change', () => localStorage.setItem('cm2Velocidade', speedSelect.value));
        let heatmapOn = localStorage.getItem('cm2Heatmap') === '1';

        function viewAtual() {
            return board.map((linha) => linha.map((cell) => cell.isRevealed ? cell.neighborMines : (cell.isFlagged ? -2 : -1)));
        }

        function corRisco(p) {
            // verde (0) → amarelo → vermelho (1)
            const h = Math.round(120 * (1 - p));
            return `hsl(${h}, 75%, ${p > 0.999 ? 55 : 72}%)`;
        }

        function atualizarHeatmap(res) {
            heatBtn.classList.toggle('bg-yellow-200', heatmapOn);
            heatBtn.classList.toggle('border-yellow-500', heatmapOn);
            if (!board.length || !gridElement.children.length) return;
            if (heatmapOn && !isGameOver && !isFirstClick && !res) res = resolverCampo(viewAtual(), rows, cols, totalMines);
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                const cell = board[r][c], el = gridElement.children[r * cols + c];
                if (!el) continue;
                if (cell.isRevealed) { el.style.backgroundColor = ''; el.classList.remove('cell-heat'); continue; }
                if (cell.isFlagged) { el.style.backgroundColor = ''; el.classList.remove('cell-heat'); continue; }
                const p = res && heatmapOn ? res.prob[r * cols + c] : NaN;
                if (heatmapOn && !Number.isNaN(p) && !isGameOver) {
                    el.style.backgroundColor = corRisco(p);
                    el.classList.add('cell-heat');
                    el.textContent = p < 0.005 && p > 0 ? '<1' : String(Math.round(p * 100));
                } else {
                    el.style.backgroundColor = '';
                    el.classList.remove('cell-heat');
                    el.textContent = '';
                }
            }
        }

        heatBtn.addEventListener('click', () => {
            heatmapOn = !heatmapOn;
            localStorage.setItem('cm2Heatmap', heatmapOn ? '1' : '0');
            atualizarHeatmap();
        });
        // Atualiza o heatmap também depois das jogadas manuais
        gridElement.addEventListener('click', () => setTimeout(() => atualizarHeatmap(), 0));
        gridElement.addEventListener('contextmenu', () => setTimeout(() => atualizarHeatmap(), 0));
        difficultySelect.addEventListener('change', () => setTimeout(() => atualizarHeatmap(), 0));
        resetBtn.addEventListener('click', () => setTimeout(() => { mostrarStatusSolver('Pronto. Ligue o autoplay ou jogue você mesmo.'); atualizarHeatmap(); }, 0));

        function mostrarStatusSolver(texto, tipo = 'info') {
            const cores = { info: 'bg-gray-100 border-gray-300 text-gray-800', certa: 'bg-green-50 border-green-400 text-green-900',
                chute: 'bg-yellow-50 border-yellow-400 text-yellow-900', erro: 'bg-red-50 border-red-400 text-red-800' };
            statusEl.className = `w-full max-w-md mb-4 rounded border px-3 py-2 text-sm font-semibold ${cores[tipo]}`;
            statusEl.textContent = texto;
        }

        function executarJogada(acao, r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return false;
            if (acao === 'cavar') {
                const prev = flagMode; flagMode = false;
                handleLeftClick(r, c);
                flagMode = prev;
            } else {
                handleRightClick(r, c);
            }
            return true;
        }

        // Estatísticas da partida (para testes e para o log)
        let solverStats = { jogadas: 0, msTotal: 0, chutes: 0, aprox: 0 };
        function playAIMove() {
            if (isGameOver) return;
            if (isFirstClick) solverStats = { jogadas: 0, msTotal: 0, chutes: 0, aprox: 0 };
            const j = escolherJogada(viewAtual(), rows, cols, totalMines);
            if (!j) return;
            const [r, c] = j.rc, ms = j.ms.toFixed(1);
            solverStats.jogadas++; solverStats.msTotal += j.ms;
            if (j.res.aprox) solverStats.aprox++;
            const sufixo = `${j.res.aprox ? ' · ≈ aproximado' : ''} · ${ms} ms`;
            if (j.certa) {
                const txt = j.acao === 'cavar' ? `🧮 jogada certa: cavar (${r},${c})` : `🚩 mina certa: bandeira (${r},${c})`;
                mostrarStatusSolver(txt + sufixo, 'certa');
                logDebug(`${txt}${sufixo}`);
            } else {
                solverStats.chutes++;
                const pct = j.risco * 100;
                const txt = `🎲 chute: ${pct < 1 && pct > 0 ? pct.toFixed(1) : Math.round(pct)}% de risco em (${r},${c})`;
                mostrarStatusSolver(txt + sufixo, 'chute');
                logDebug(`${txt} — fronteira ${j.res.fronteira}, interior ${j.res.interior}, ${j.res.comps} componente(s)${sufixo}`);
            }
            executarJogada(j.acao, r, c);
            if (isGameOver) {
                const venceu = cellsRevealed === rows * cols - totalMines;
                mostrarStatusSolver(`${venceu ? '🏆 Vitória!' : '💥 Perdeu no chute.'} ${solverStats.jogadas} jogadas, ${solverStats.chutes} chute(s), média ${(solverStats.msTotal / solverStats.jogadas).toFixed(1)} ms/jogada`, venceu ? 'certa' : 'erro');
            }
            atualizarHeatmap();
        }

        // Iniciar o jogo na primeira carga
        window.onload = () => { initGame(); atualizarHeatmap(); };

    </script>
</body>
