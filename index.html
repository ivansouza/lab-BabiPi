<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lab-BabiPi — Laboratório</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #060816;
  --bg-soft: #0c1224;
  --panel: rgba(10, 15, 31, 0.78);
  --panel-strong: rgba(15, 23, 42, 0.94);
  --line: rgba(148, 163, 184, 0.14);
  --text: #e5eefc;
  --muted: #8b9bb7;
  --cyan: #38bdf8;
  --violet: #8b5cf6;
  --emerald: #34d399;
  --amber: #f59e0b;
  --rose: #fb7185;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 30%),
    radial-gradient(circle at top right, rgba(139, 92, 246, 0.12), transparent 30%),
    radial-gradient(circle at bottom center, rgba(52, 211, 153, 0.08), transparent 30%),
    linear-gradient(180deg, #03050d 0%, #070b17 40%, #060816 100%);
}

.app-shell {
  width: min(1200px, calc(100vw - 24px));
  margin: 24px auto;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
}

.card-hover {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: 0 32px 96px rgba(0, 0, 0, 0.45);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}

</style>
</head>
<body>

<div class="app-shell">
  <!-- Header -->
  <header class="mb-8">
    <div class="flex items-center gap-3 mb-2">
      <span class="text-3xl">🧪</span>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-violet-400 bg-clip-text text-transparent">
        lab-BabiPi
      </h1>
    </div>
    <p class="text-muted text-sm">Laboratório interativo de Ivan Souza</p>
  </header>

  <!-- Grid de projetos (gerado automaticamente) -->
  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <p id="sync-status" class="text-muted text-xs mt-4"></p>

  <!-- Footer -->
  <footer class="mt-12 text-center text-muted text-xs">
    <p>lab-BabiPi &copy; 2026 — Ivan Souza</p>
  </footer>
</div>

<script>
const username = 'ivansouza', repo = 'lab-BabiPi';
// Metadados opcionais: arquivos que não estiverem aqui aparecem sozinhos, varridos do GitHub
const known = {
  'campo-minado.html': { icon: '💣', name: 'Campo Minado', sub: 'Jogo + IA (bev)', desc: 'Campo Minado clássico com 3 dificuldades, modo bandeira no celular e autoplay: um solver lógico faz as jogadas certas e o modelo de decisão bev escolhe os chutes.' },
  'lista-compras.html': { icon: '🛒', name: 'Lista de Compras', sub: 'App web responsivo', desc: 'Lista de compras interativa com adicionar, editar, excluir e marcar itens como "no carrinho". Design otimizado para celular.' },
  'shader.html': { icon: '✨', name: 'Shader 3D', sub: 'Three.js', desc: 'Experimento visual em 3D com cubos animados e iluminação, feito com Three.js.' },
};
const ignore = ['index.html'];
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pretty(file) {
  const b = file.replace(/\.html$/i, '').replace(/[-_]+/g, ' ').trim();
  return b.charAt(0).toUpperCase() + b.slice(1);
}
function card(e) {
  return `<div class="glass card-hover p-6">
    <div class="flex items-start justify-between mb-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">${e.icon || '🧪'}</span>
        <div><h2 class="text-lg font-semibold text-white">${esc(e.name)}</h2>
        <p class="text-muted text-xs">${esc(e.sub || '')}${e.date ? ' · ' + e.date : ''}</p></div>
      </div>
      ${e.isNew ? '<span class="badge" style="background:rgba(52,211,153,.12);color:#34d399">novo</span>' : ''}
    </div>
    <p class="text-muted text-sm mb-4">${esc(e.desc || 'Experimento do laboratório.')}</p>
    <a href="${encodeURI(e.file)}" target="_blank" class="inline-flex items-center gap-2 text-cyan-400 hover:text-cyan-300 transition-colors text-sm font-medium">
      <i class="fas fa-external-link-alt"></i> Abrir</a>
  </div>`;
}
let items = Object.entries(known).map(([file, m]) => ({ file, ...m }));
const grid = document.getElementById('grid'), status = document.getElementById('sync-status');
function render() {
  items.sort((a, b) => (b.ts || 0) - (a.ts || 0) || a.name.localeCompare(b.name));
  grid.innerHTML = items.map(card).join('');
}
async function lastCommit(file) {
  try {
    const r = await fetch(`https://api.github.com/repos/${username}/${repo}/commits?path=${encodeURIComponent(file)}&per_page=1`);
    const c = await r.json();
    return Array.isArray(c) && c.length ? new Date(c[0].commit.author.date) : null;
  } catch { return null; }
}
async function sync() {
  try {
    const r = await fetch(`https://api.github.com/repos/${username}/${repo}/contents`);
    if (!r.ok) throw new Error(r.status);
    const files = (await r.json()).filter(i => i.type === 'file' && /\.html$/i.test(i.name) && !ignore.includes(i.name.toLowerCase())).map(i => i.name);
    items = items.filter(e => files.includes(e.file));
    for (const f of files) if (!items.some(e => e.file === f)) items.push({ file: f, name: pretty(f), sub: 'Adicionado automaticamente' });
    await Promise.all(items.map(async e => {
      const d = await lastCommit(e.file);
      if (d) { e.ts = d.getTime(); e.date = d.toLocaleDateString('pt-BR'); e.isNew = Date.now() - e.ts < 3 * 864e5; }
    }));
    render();
    status.textContent = `${items.length} projetos · lista sincronizada com o GitHub`;
  } catch (err) { status.textContent = 'Não consegui sincronizar com o GitHub agora; mostrando a lista salva.'; }
}
render(); sync();
</script>
</body>
</html>
