<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Plasma Vortex</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #overlay {
            position: fixed; left: 50%; bottom: 8%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.75);
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 13px; letter-spacing: 0.04em;
            pointer-events: none; opacity: 1;
            transition: opacity 1.2s ease-out;
            text-align: center; z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        #overlay.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="overlay">toque para pausar</div>

    <canvas id="glCanvas"></canvas>
    <script>
    (function () {
        const canvas = document.getElementById('glCanvas');
        const overlay = document.getElementById('overlay');

        // WebGL2 (GLSL ES 3.00) — necessário para a sintaxe do shader original
        const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
        if (!gl) {
            overlay.textContent = 'WebGL2 não suportado neste navegador';
            return;
        }

        const vsSource = `#version 300 es
            in vec2 a_position;
            void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
        `;

        // Shader original (dialeto Shadertoy) adaptado para GLSL ES 3.00
        const fsSource = `#version 300 es
            precision highp float;
            out vec4 fragColor;

            uniform vec2 r;   // resolução
            uniform float t;  // tempo

            mat2 rotate2D(float a) {
                float c = cos(a), s = sin(a);
                return mat2(c, -s, s, c);
            }

            vec3 hsv(float h, float s, float v) {
                vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
                return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
            }

            void main() {
                vec4 FC = vec4(gl_FragCoord.xy, 0.0, 1.0);
                vec3 o = vec3(0.0);
                for (float i = 0., z = 0., d = 0., s = 0.; i++ + z < 1.3e2;) {
                    vec3 q = z * normalize(vec3(FC.xy * 2.0 - r, r.y));
                    q.z += t;
                    q.yx *= rotate2D(q.z * 0.2);
                    for (s = 4.; s < 32.; s /= 0.5)
                        q += cos(q.yzx * s + t) / s;
                    z += d = 0.008 + abs((length(q.yx) - 6.0) * q.x) / 5.0;
                    o.rgb += hsv(0.07 + sin(z * 0.4) * 0.03, 0.75, 0.7) / d;
                }
                o = tanh(o / 9e2);
                fragColor = vec4(o, 1.0);
            }
        `;

        function compile(type, src) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(sh));
                return null;
            }
            return sh;
        }

        const vs = compile(gl.VERTEX_SHADER, vsSource);
        const fs = compile(gl.FRAGMENT_SHADER, fsSource);
        if (!vs || !fs) { overlay.textContent = 'erro ao compilar shader'; return; }
    }< /script>
</body>
</html>
