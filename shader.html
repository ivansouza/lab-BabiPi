<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shader Three.js — lab-BabiPi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js"
  }
}
</script>
</head>
<body>

<script type="module">
import * as THREE from 'three';

// Parâmetros
const TAU = Math.PI * 2;
const rows = 32; // j: 0 a PI, passo PI/32 = 32 rows
const cols = 256; // i: 0 a TAU, passo PI/128 = 256 cols
const totalInstances = rows * cols; // 8192 instâncias

// Cena, Câmera, Renderizador
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.z = 600;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Luzes - intensidade ajustada para three.js recente
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const pointLight1 = new THREE.PointLight(0x38bdf8, 3, 1500, 0); // decay: 0 para luz não enfraquecer
pointLight1.position.set(300, 300, 300);
scene.add(pointLight1);
const pointLight2 = new THREE.PointLight(0x8b5cf6, 3, 1500, 0); // decay: 0
pointLight2.position.set(-300, -300, 300);
scene.add(pointLight2);

// Geometry única de baixa resolução
const geometry = new THREE.SphereGeometry(3, 8, 8);

// Material
const material = new THREE.MeshPhongMaterial({
  color: 0x38bdf8,
  emissive: 0x38bdf8,
  emissiveIntensity: 0.4,
  shininess: 150
});

// InstancedMesh com todas as instâncias
const instancedMesh = new THREE.InstancedMesh(geometry, material, totalInstances);
scene.add(instancedMesh);

// Objeto auxiliar para calcular matrizes
const dummy = new THREE.Object3D();

// Variáveis do snippet
let f = 0;

// Função para calcular posição de cada instância
function updateInstances() {
  let index = 0;
  
  for (let j = 0; j < Math.PI; j += Math.PI / 32) {
    for (let i = 0; i < TAU; i += Math.PI / 128) {
      // Cálculos do snippet original
      const t = Math.tan(Math.atan(i));
      const s = 150 * Math.sin(j + i);
      const x = Math.sin(t) * s;
      const y = Math.tan(Math.cos(i + f)) * Math.sin(i + f) * 150;
      const z = Math.cos(t) * s;
      
      // Escala baseada em cos(i+f)
      const scale = Math.abs(Math.cos(i + f));
      
      // Usa objeto auxiliar para definir transformações
      dummy.position.set(x, y, z);
      dummy.scale.setScalar(scale);
      dummy.rotation.set(0, i + f, 0);
      dummy.updateMatrix();
      
      instancedMesh.setMatrixAt(index, dummy.matrix);
      index++;
    }
  }
  
  instancedMesh.instanceMatrix.needsUpdate = true;
  f += 0.002; // incrementa f a cada frame
}

// Atualiza instâncias inicialmente
updateInstances();

// Animação
function animate() {
  requestAnimationFrame(animate);
  
  // Atualiza posições a cada frame
  updateInstances();
  
  // Rotaciona cena lentamente
  scene.rotation.y += 0.001;
  scene.rotation.x += 0.0005;
  
  renderer.render(scene, camera);
}

animate();

// Responsivo
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
